# policy_config.yaml — thresholds, allowlists, trust weights, and signal weights.
# Loaded into Rego as data.config. signal_weights is also the table the
# sidecar's aggregate stage scores signals with — the only one; sidecar.yaml
# no longer carries it. Every category the sidecar or the SDK scanner can emit
# must appear there, or it scores 0.0 and cannot change a verdict; the
# signal-weight contract tests (Go and Python) enforce this.
# Hot-reloadable: the policy engine re-reads this file every 5 seconds.

thresholds:
  block_score: 0.85      # risk score >= this → BLOCK
  sanitise_score: 0.50   # risk score >= this → SANITISE

trust_weights:
  user_input: 1.0        # highest — direct prompt injection risk
  tool_output: 0.8
  rag_chunk: 0.7
  memory_read: 0.6

tool_allowlist:          # tools permitted by allowlist gate; empty = block all; omit key = allow all
  - search
  - calculator
  - get_weather
  - read_file

memory_key_allowlist: [] # permitted memory keys; empty = allow all

destination_allowlist:    # permitted network destinations for tool calls; omit key = allow all
  - api.example.com
  - cdn.example.com

trusted_tools: []         # tools whose output the deployment controls (e.g. an internal API);
                          # on_tool_result does not screen their output. Empty = screen all.

signal_weights:          # per-signal contribution to risk score
  # integrity
  hmac_invalid: 1.0           # always hard block

  # request validation (emitted by the validate and session stages)
  validate:invalid_hook_type: 1.0
  validate:invalid_session_id: 1.0
  validate:missing_provenance: 0.9
  validate:nil_payload: 1.0
  validate:invalid_payload: 1.0   # payload shape rejected by the hook's validator

  # task scope declarations (emitted by the session stage on on_task)
  task:no_session: 1.0          # a scope must belong to a session
  task:invalid_scope: 1.0       # the declaration does not parse
  task:already_declared: 1.0    # a session's scope is set once

  # catch-all backward-compat signal emitted on every pattern hit
  jailbreak_pattern: 0.9

  # prompt / context injection
  instruction_override: 0.85
  indirect_injection: 0.85    # injected via retrieved documents (RAG)
  memory_poisoning: 0.85      # long-term state poisoning via memory write
  tool_description_poisoning: 0.85  # hijacks tool behaviour at definition time
  role_escalation: 0.8
  context_manipulation: 0.8   # context override injected via retrieved content
  system_prompt_extraction: 0.8
  data_exfiltration: 0.8

  # tool / boundary
  tool:not_allowed: 0.9
  tool_boundary_violation: 0.8
  shell_metacharacter: 0.75   # was shell_metachar — aligned with tool.rego category name
  path_traversal: 0.75

  # multi-turn
  multi_turn_manipulation: 0.75

  # evasion / obfuscation
  encoding_bypass: 0.70
  delimiter_escape: 0.70
  unicode_obfuscation: 0.65
  embedded_instruction: 0.65

  # memory
  memory:key_not_allowed: 0.7

  # low-confidence structural signals
  structural_anomaly: 0.40
